[build]
  command = "npm run build"
  publish = "dist"

[functions]
  # Shared teaching-log endpoint (ADR-013, Phase B). Requires the
  # TEACHING_LOG_PASSCODE environment variable set in Netlify (never in the repo).
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22.23.2"

[context.production.environment]
  # GO-LIVE (2026-08-14, ADR-015): all lessons were promoted to status
  # "approved" (editorial review sign-offs recorded in each lesson's
  # editorial.review_state) per explicit owner decision, so production now
  # renders the real, approved curriculum (ADR-011). This deliberately includes
  # the freshly imported batches 11-14, which had not been through editorial
  # review at go-live. Deploy Previews and branch deploys stay in preview so
  # in-progress Decap drafts remain reviewable there.
  CONTENT_MODE = "production"

[context.deploy-preview]
  command = "npm run build"

[context.deploy-preview.environment]
  # Deploy Previews (Decap pull requests) render draft content for review (ADR-011).
  CONTENT_MODE = "preview"

[context.branch-deploy]
  command = "npm run build"

[context.branch-deploy.environment]
  CONTENT_MODE = "preview"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888
  framework = "#auto"
