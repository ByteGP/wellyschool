[build]
  command = "npm run build"
  publish = "dist"

[functions]
  # Shared teaching-log endpoint (ADR-013, Phase B). Requires the
  # TEACHING_LOG_PASSCODE environment variable set in Netlify (never in the repo).
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22.23.2"

[context.production.environment]
  # PILOT PHASE: the production branch (main) renders in_review content so the
  # team can review the whole curriculum on the live site. All lessons are still
  # in_review, so real "production" mode would render an empty site (ADR-011).
  #
  # TO GO LIVE with approved content only: change this to "production" (one line,
  # through a reviewed PR). Deploy Previews and branch deploys stay in preview.
  CONTENT_MODE = "preview"

[context.deploy-preview]
  command = "npm run build"

[context.deploy-preview.environment]
  # Deploy Previews (Decap pull requests) render draft content for review (ADR-011).
  CONTENT_MODE = "preview"

[context.branch-deploy]
  command = "npm run build"

[context.branch-deploy.environment]
  CONTENT_MODE = "preview"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888
  framework = "#auto"
