- name: schedule
  label: Schedule entries
  label_singular: Schedule entry
  folder: src/content/schedule
  create: true
  format: json
  extension: json
  identifier_field: schedule_id
  slug: '{{fields.date}}-{{fields.segment}}'
  summary: '{{date}} - {{segment}} - {{entry_type}} - {{lesson_id}}'
  fields:
  - label: Schedule ID
    name: schedule_id
    widget: string
    hint: Use YYYY-MM-DD-segment.
  - label: Date
    name: date
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
  - label: Segment
    name: segment
    widget: select
    options:
    - Kids
    - Youths
    - Teens
  - label: Entry type
    name: entry_type
    widget: select
    options:
    - lesson
    - break
    - special
  - label: Lesson ID
    name: lesson_id
    widget: string
    required: false
    hint: Required only when entry type is lesson.
  - label: Title override
    name: title_override
    widget: string
    required: false
  - label: Message
    name: message
    widget: text
    required: false
  - label: Status
    name: status
    widget: select
    options:
    - draft
    - approved
    - cancelled
    default: draft
  - label: Notes
    name: notes
    widget: text
    required: false
- name: resources
  label: Printable resources
  label_singular: Printable resource
  folder: src/content/resources
  create: true
  format: json
  extension: json
  identifier_field: resource_id
  slug: '{{fields.resource_id}}'
  summary: '{{resource_id}} - {{title}} - {{status}}'
  fields:
  - label: Resource ID
    name: resource_id
    widget: string
  - label: Lesson ID
    name: lesson_id
    widget: string
  - label: Title
    name: title
    widget: string
  - label: Purpose
    name: purpose
    widget: text
  - label: Format
    name: format
    widget: select
    options:
    - A4
    - US Letter
    - cards
    - worksheet
    - none
  - label: Status
    name: status
    widget: select
    options:
    - placeholder
    - content_source_draft
    - ready
  - label: Body
    name: body_markdown
    widget: text
    hint: Markdown source used to render the printable.
- name: settings
  label: Settings
  files:
  - label: Site settings
    name: site
    file: src/content/settings/site.json
    format: json
    fields:
    - label: Site name
      name: site_name
      widget: string
    - label: Timezone
      name: timezone
      widget: string
      default: Pacific/Auckland
    - label: Default teacher profile
      name: default_teacher_profile
      widget: select
      options:
      - essential
      - standard
      - extended
      default: standard
    - label: Family duration minutes
      name: family_duration_minutes
      widget: number
      value_type: int
      default: 15
    - label: Public teacher routes
      name: public_teacher_routes
      widget: boolean
      default: true
    - label: Show upcoming lessons
      name: show_upcoming_lessons
      widget: boolean
      default: false
