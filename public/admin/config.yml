backend:
  name: github
  repo: __GITHUB_OWNER__/__REPOSITORY__
  branch: main
  auth_scope: repo
  squash_merges: true
  use_graphql: true
publish_mode: editorial_workflow
local_backend: true
media_folder: public/uploads
public_folder: /uploads
editor:
  preview: false
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: lessons_kids
  label: Kids lessons
  label_singular: Kids lesson
  folder: src/content/lessons/kids
  create: true
  format: json
  extension: json
  identifier_field: lesson_id
  slug: '{{fields.lesson_id}}'
  summary: '{{lesson_id}} - {{status}}'
  sortable_fields:
  - lesson_id
  - status
  view_filters:
  - label: In review
    field: status
    pattern: in_review
  - label: Approved
    field: status
    pattern: approved
  - label: Published
    field: status
    pattern: published
  fields:
  - label: Schema Version
    name: schema_version
    widget: hidden
    default: 1.2.0
  - label: Lesson ID
    name: lesson_id
    widget: string
    pattern:
    - ^[KYT][1-5]-L[0-9]{2}$
    - Lesson ID has an invalid format
    hint: Stable curriculum ID for Kids; do not change after creation.
  - label: Content Version
    name: content_version
    widget: string
    pattern:
    - ^[0-9]+\.[0-9]+\.[0-9]+$
    - Content Version has an invalid format
    default: 0.1.0
  - label: Status
    name: status
    widget: select
    options:
    - vertical_slice_draft
    - in_review
    - approved
    - scheduled
    - published
    - retired
    default: vertical_slice_draft
  - label: Curriculum
    name: curriculum
    widget: object
    collapsed: true
    fields:
    - label: Segment
      name: segment
      widget: hidden
      default: Kids
    - label: Age range
      name: age_range
      widget: hidden
      default: 4-8
    - label: Cycle ID
      name: cycle_id
      widget: select
      options:
      - K1
      - K2
      - K3
      - K4
      - K5
    - label: Cycle Name
      name: cycle_name
      widget: string
    - label: Sequence
      name: sequence
      widget: number
      value_type: int
      min: 1
      max: 30
    - label: Unit Type
      name: unit_type
      widget: select
      options:
      - Core
      - Synthesis
      - Flex
    - label: Scheduling Priority
      name: scheduling_priority
      required: false
      widget: select
      options:
      - Required
      - Recommended
      - Optional
    - label: Title
      name: title
      widget: string
    - label: Annual Anchor
      name: annual_anchor
      required: false
      widget: string
    - label: Thematic Unit
      name: thematic_unit
      required: false
      widget: string
