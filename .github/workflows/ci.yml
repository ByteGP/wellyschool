name: Quality

# Runs the full gate on every push to main and on every pull request
# (including Decap CMS content PRs), plus manual dispatch.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel a superseded run when new commits land on the same ref.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Validate, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate:content

      - name: Type-check
        run: npm run check

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build
